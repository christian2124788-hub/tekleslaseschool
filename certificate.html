<!doctype html>
<html lang="am">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>የምስክር ወረቀት | ተክለሥላሴ</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Poppins:wght@400;600&display=swap");

            /* --- አጠቃላይ አቀማመጥ --- */
            body {
                background-color: #2c1e16;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                padding: 30px 15px;
                font-family: "Poppins", sans-serif;
                box-sizing: border-box;
            }

            .action-container {
                margin-bottom: 20px;
                width: 100%;
                max-width: 900px;
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 15px;
            }

            .action-btn {
                background: linear-gradient(135deg, #d4af37, #aa8222);
                color: #fff;
                padding: 10px 25px;
                border: none;
                border-radius: 8px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
                transition: all 0.3s ease;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .action-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
            }

            /* --- ሰርተፍኬት ዲዛይን --- */
            .cert-scroll-wrapper {
                width: 100%;
                max-width: 1000px;
                overflow-x: auto; /* ለስልክ እንዲመች */
                display: flex;
                justify-content: center;
                padding-bottom: 20px;
            }

            .certificate-wrapper {
                background: #fdfbf7;
                width: 100%;
                min-width: 700px; /* በስልክ ሲታይ ቅርፁ እንዳይበላሽ */
                max-width: 900px;
                position: relative;
                box-sizing: border-box;
                text-align: center;
                padding: 40px 50px;
                border: 10px solid #5d4037;
                outline: 4px solid #d4af37;
                outline-offset: -18px; /* የውስጥ ቦርደር እንዲመስል */
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
                background-image: radial-gradient(
                    rgba(212, 175, 55, 0.1) 1px,
                    transparent 1px
                );
                background-size: 20px 20px;
            }

            .cert-logo {
                width: 100px;
                height: 100px;
                margin: 0 auto 15px;
                background: #fff;
                border: 3px solid #d4af37;
                border-radius: 50%;
                padding: 5px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
                object-fit: contain;
                display: block;
            }

            .cert-header {
                color: #c09440;
                font-size: 1.2rem;
                font-weight: 800;
                letter-spacing: 2px;
                text-transform: uppercase;
                margin-bottom: 5px;
            }

            .cert-title {
                font-family: "Playfair Display", serif;
                font-size: 3.5rem;
                color: #b8860b;
                margin: 0 0 20px;
                font-weight: 800;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            }

            .cert-text {
                font-size: 1.1rem;
                color: #4e342e;
                line-height: 1.8;
                margin: 0 auto;
                max-width: 80%;
            }

            .student-name {
                font-family: "Playfair Display", serif;
                font-size: 2.8rem;
                color: #8b5a2b;
                font-weight: 800;
                margin: 15px auto;
                border-bottom: 2px dashed #d4af37;
                display: inline-block;
                padding: 0 20px 5px;
            }

            .course-name {
                font-weight: 800;
                color: #d4af37;
                font-size: 1.2rem;
            }

            /* --- የውጤት ክፍል --- */
            .score-board {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin: 30px auto;
                max-width: 90%;
            }

            .score-card {
                background: #fff;
                border: 2px solid #e0c98b;
                border-radius: 10px;
                padding: 10px 20px;
                min-width: 130px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            }

            .score-card.total {
                background: linear-gradient(135deg, #5d4037, #3e2723);
                border-color: #d4af37;
            }

            .score-card.total .score-label,
            .score-card.total .score-value {
                color: #fff;
            }

            .score-label {
                display: block;
                font-size: 0.85rem;
                margin-bottom: 5px;
                font-weight: 600;
                color: #6d4c41;
            }

            .score-value {
                font-size: 1.6rem;
                font-weight: 800;
                color: #b8860b;
            }

            /* --- ፊርማ እና ቀን --- */
            .footer {
                margin-top: 40px;
                display: flex;
                justify-content: space-around;
                align-items: center;
            }

            .signature-box {
                text-align: center;
                width: 200px;
            }

            .signature-line {
                border-bottom: 2px solid #5d4037;
                height: 30px;
                margin-bottom: 5px;
                font-size: 1.1rem;
                display: flex;
                align-items: flex-end;
                justify-content: center;
                padding-bottom: 5px;
                color: #4e342e;
                font-weight: 600;
            }

            .signature-text {
                color: #8b5a2b;
                font-size: 0.9rem;
                font-weight: 600;
            }

            .stamp {
                width: 80px;
                height: 80px;
                border: 3px dashed #d4af37;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #d4af37;
                font-weight: bold;
                font-size: 0.8rem;
                transform: rotate(-15deg);
                opacity: 0.7;
            }

            /* --- ህትመት (Print) --- */
            @media print {
                @page {
                    size: A4 landscape;
                    margin: 0;
                }
                body {
                    background: #fff;
                    padding: 0;
                    align-items: center;
                    justify-content: center;
                }
                .action-container {
                    display: none;
                }
                .cert-scroll-wrapper {
                    overflow: visible;
                }
                .certificate-wrapper {
                    width: 297mm;
                    height: 210mm;
                    max-width: none;
                    min-width: 0;
                    box-shadow: none;
                    border: 15px solid #5d4037;
                    outline: 5px solid #d4af37;
                    outline-offset: -25px;
                    transform: scale(0.95);
                    -webkit-print-color-adjust: exact;
                    print-color-adjust: exact;
                }
            }
        </style>
    </head>
    <body>
        <div class="action-container">
            <button class="action-btn" id="downloadBtn">
                <i class="fas fa-download"></i> በምስል አውርድ
            </button>
            <button class="action-btn" id="printBtn">
                <i class="fas fa-print"></i> ፕሪንት አድርግ
            </button>
        </div>

        <div class="cert-scroll-wrapper">
            <div class="certificate-wrapper" id="certificateBox">
                <!-- ሎጎ ማስተካከያ (pawlos.png) -->
                <img
                    src="pawlos.png"
                    alt="ሎጎ"
                    class="cert-logo"
                    onerror="this.style.display = 'none'"
                />

                <div class="cert-header">ተክለሥላሴ ሰንበት ትምህርት ቤት</div>
                <h1 class="cert-title">የምስክር ወረቀት</h1>

                <div class="cert-text">ይህ የምስክር ወረቀት የተሰጠው ለ</div>
                <div class="student-name" id="certName">የተማሪው ስም</div>

                <div class="cert-text">
                    በተክለሥላሴ የመማሪያ ማዕከል የተዘጋጀውን የ
                    <span class="course-name">የቤተክርስቲያን ታሪክ</span> ትምህርት<br />
                    ተከታትሎ በማጠናቀቅ ከዚህ በታች የተገለጸውን ከፍተኛ ውጤት<br />ስላስመዘገበ(ች) ይህን
                    የዕውቅና ምስክር ወረቀት በደስታ አበርክተናል።
                </div>

                <div class="score-board">
                    <div class="score-card">
                        <span class="score-label">የማጠቃለያ ፈተና</span>
                        <!-- ከ 20 -->
                        <span class="score-value" id="certExam">0/20</span>
                    </div>
                    <div class="score-card">
                        <span class="score-label">የምርምር አሳይመንት</span>
                        <!-- ለሁሉም 10 -->
                        <span class="score-value" id="certAss">10/10</span>
                    </div>
                    <div class="score-card total">
                        <span class="score-label">አጠቃላይ ውጤት</span>
                        <!-- ከ 30 -->
                        <span class="score-value" id="certTotal">0/30</span>
                    </div>
                </div>

                <div class="footer">
                    <div class="signature-box">
                        <div class="signature-line" id="certDate"></div>
                        <div class="signature-text">የተሰጠበት ቀን</div>
                    </div>
                    <div class="stamp">ተረጋገጠ</div>
                    <div class="signature-box">
                        <div class="signature-line"></div>
                        <div class="signature-text">የኃላፊው ፊርማ</div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function populateData() {
                // የተማሪው ስም
                let storedName =
                    localStorage.getItem("student_name") || "የአባል ስም";
                document.getElementById("certName").innerText = storedName;

                // 1. የፈተና ውጤት ከዳሽቦርድ (localStorage) ተቀብሎ ከ 20 እንዲሆን
                let examScore =
                    parseInt(localStorage.getItem("exam_score")) || 0;
                if (examScore > 20) examScore = 20; // ከ 20 እንዳይበልጥ መቆጣጠሪያ

                // 2. የአሳይመንት ውጤት ለሁሉም 10
                let assScore = 10;

                // 3. አጠቃላይ ውጤት (ከ 30)
                let totalScore = examScore + assScore;

                // ውጤቶቹን በገጹ ላይ ማሳየት
                document.getElementById("certExam").innerText =
                    examScore + " / 20";
                document.getElementById("certAss").innerText =
                    assScore + " / 10";
                document.getElementById("certTotal").innerText =
                    totalScore + " / 30";

                // የዛሬው ቀን በኢትዮጵያ ካላንደር
                let today = new Date();
                let options = {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                    calendar: "ethiopic",
                };
                try {
                    let ethiopianDate = new Intl.DateTimeFormat(
                        "am-ET-u-ca-ethiopic",
                        options,
                    ).format(today);
                    document.getElementById("certDate").innerText =
                        ethiopianDate;
                } catch (e) {
                    document.getElementById("certDate").innerText =
                        today.toLocaleDateString();
                }
            }

            // በምስል የማውረድ ስራ
            function downloadAsImage() {
                const btn = document.getElementById("downloadBtn");
                const certBox = document.getElementById("certificateBox");

                btn.innerHTML =
                    '<i class="fas fa-spinner fa-spin"></i> እያዘጋጀ ነው...';
                btn.disabled = true;

                html2canvas(certBox, {
                    scale: 2, // ጥራቱን ጠብቆ እንዲወርድ
                    useCORS: true,
                    backgroundColor: "#fdfbf7",
                })
                    .then((canvas) => {
                        let link = document.createElement("a");
                        let stuName = document
                            .getElementById("certName")
                            .innerText.split(" ")[0];
                        link.download = stuName + "_ሰርተፍኬት.png";
                        link.href = canvas.toDataURL("image/png");
                        link.click();

                        btn.innerHTML =
                            '<i class="fas fa-download"></i> በምስል አውርድ';
                        btn.disabled = false;
                    })
                    .catch((err) => {
                        console.error("Image generation failed:", err);
                        alert("ይቅርታ፣ ምስሉን ማዘጋጀት አልተቻለም።");
                        btn.innerHTML =
                            '<i class="fas fa-download"></i> በምስል አውርድ';
                        btn.disabled = false;
                    });
            }

            function printCertificate() {
                window.print();
            }

            document
                .getElementById("downloadBtn")
                .addEventListener("click", downloadAsImage);
            document
                .getElementById("printBtn")
                .addEventListener("click", printCertificate);

            // ገጹ ሲከፈት መረጃዎቹን ይሙላ
            window.onload = populateData;
        </script>
    </body>
</html>
