<!doctype html>
<html lang="am">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ተክለሥላሴ ሰንበት ትምህርት ቤት | ስልጠና</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        />

        <style>
            :root {
                --gold: #d4af37;
                --navy: #0a192f;
                --light-navy: #172a45;
                --white: #ffffff;
                --transition: all 0.3s ease;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: "Segoe UI", "Abyssinica SIL", sans-serif;
            }
            body {
                background-color: #f8f9fa;
                color: var(--navy);
                line-height: 1.6;
            }
            /* Navbar */
            .navbar {
                position: fixed;
                top: 0;
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 15px 8%;
                background: rgba(10, 25, 47, 0.9);
                backdrop-filter: blur(10px);
                z-index: 1000;
            }
            .logo {
                display: flex;
                align-items: center;
                gap: 12px;
                color: var(--white);
                font-size: 1.5rem;
                font-weight: bold;
                text-decoration: none;
            }
            .logo img {
                height: 45px;
                width: 45px;
                border-radius: 50%;
                border: 2px solid var(--gold);
            }
            .logo span span {
                color: var(--gold);
            }
            .nav-right {
                display: flex;
                align-items: center;
                gap: 20px;
            }
            .login-btn {
                color: var(--white);
                text-decoration: none;
                font-weight: 500;
                transition: var(--transition);
            }
            .login-btn:hover {
                color: var(--gold);
            }
            /* Hero Section */
            .hero {
                height: 100vh;
                background:
                    linear-gradient(
                        rgba(10, 25, 47, 0.7),
                        rgba(10, 25, 47, 0.7)
                    ),
                    url("https://images.unsplash.com/photo-1504052434569-70ad5836ab65?auto=format&fit=crop&q=80&w=2000");
                background-size: cover;
                background-position: center;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                color: white;
                padding: 0 20px;
            }
            .hero-content h1 {
                font-size: clamp(2rem, 5vw, 4rem);
                margin-bottom: 20px;
            }
            .hero-content p {
                font-size: clamp(1rem, 2vw, 1.2rem);
                margin-bottom: 30px;
                max-width: 700px;
                margin-left: auto;
                margin-right: auto;
            }
            /* Buttons Style */
            .cta-container {
                display: flex;
                flex-direction: row;
                justify-content: center;
                gap: 15px;
                flex-wrap: wrap;
            }
            .btn {
                padding: 15px 35px;
                border-radius: 50px;
                text-decoration: none;
                font-weight: 600;
                font-size: 1.1rem;
                transition: var(--transition);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                border: 2px solid transparent;
            }
            .btn-start {
                background-color: var(--gold);
                color: var(--navy);
                box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            }
            .btn-start:hover {
                transform: translateY(-3px);
                box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
                background-color: #e5be45;
            }
            .btn-outline {
                border: 2px solid var(--white);
                color: var(--white);
            }
            .btn-outline:hover {
                background-color: var(--white);
                color: var(--navy);
            }
            /* Mobile Adjustments */
            @media (max-width: 768px) {
                .navbar {
                    padding: 15px 5%;
                }
                .cta-container {
                    flex-direction: column;
                    width: 100%;
                    max-width: 300px;
                    margin: 0 auto;
                }
                .btn {
                    width: 100%;
                }
            }
            /* Reveal Animation */
            .reveal {
                opacity: 0;
                transform: translateY(30px);
                transition: all 0.8s ease;
            }
            .reveal.active {
                opacity: 1;
                transform: translateY(0);
            }
        </style>
    </head>
    <body>
        <nav class="navbar">
            <a href="#" class="logo">
                <img src="pawlos.png" alt="ሎጎ" />
                <span>ተክለ<span>ሥላሴ</span></span>
            </a>
            <div class="nav-right">
                <a href="#login" class="login-btn">መግብያ</a>
                <a
                    href="home.html"
                    class="btn btn-outline"
                    style="padding: 8px 20px; font-size: 0.9rem"
                    >ተመዝገብ</a
                >
            </div>
        </nav>
        <section class="hero">
            <div class="hero-content reveal">
                <h1>መንፈሳዊ እውቀት ለሁሉም</h1>
                <p>
                    በተክለሥላሴ ሰንበት ትምህርት ቤት የትምህርት ክፍል የተዘጋጁ ልዩ ልዩ ስልጠናዎችን በመውሰድ
                    መንፈሳዊ ህይወትዎን ያሳድጉ።
                </p>

                <div class="cta-container">
                    <a href="home.html" class="btn btn-start">
                        <i class="fas fa-graduation-cap"></i> ስልጠና ለመጀመር
                    </a>

                    <a href="books.html" class="btn btn-outline">
                        <i class="fas fa-book-open-reader"></i> የመጽሀፍት ማግኛ
                    </a>

                    <a
                        href="#"
                        class="btn btn-outline"
                        onclick="accessTeacherPanel(event)"
                    >
                        <i class="fas fa-user-shield"></i> የመምህራን ክፍል
                    </a>
                </div>
            </div>
        </section>

        <script>
            // Reveal animation observer
            const observer = new IntersectionObserver(
                (entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add("active");
                        }
                    });
                },
                { threshold: 0.1 },
            );
            document
                .querySelectorAll(".reveal")
                .forEach((el) => observer.observe(el));

            // Password function for teacher's panel
            function accessTeacherPanel(event) {
                event.preventDefault();

                const accessCode = "tekleslase123";
                const userInput = prompt("የመምህራንን ክፍል ለማግኘት እባክዎ ኮዱን ያስገቡ:");

                if (userInput === null) {
                    return;
                }

                if (userInput === accessCode) {
                    alert("ኮዱ ትክክል ነው! ወደ መምህራን ገጽ ይመራሉ...");
                    window.location.href = "teacher.html";
                } else {
                    alert("የተሳሳተ ኮድ ነው! መዳረሻ ተከልክሏል (ACCESS DENIED)");
                }
            }
        </script>
    </body>
</html>
